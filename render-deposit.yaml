services:
  - type: worker
    name: muck-deposit-bot
    runtime: node
    plan: starter
    region: oregon
    rootDir: drift lobby
    buildCommand: npm ci --omit=dev
    startCommand: 'set -eu; if [ ! -s "$PUBLIC_POOL" ]; then echo "Waiting for the public wallet pool on the persistent disk"; fi; while [ ! -s "$PUBLIC_POOL" ]; do sleep 5; done; exec node server.js'
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_POOL
        value: /var/data/public-pool.json
      - key: DISCORD_TOKEN
        sync: false
    disk:
      name: muck-deposit-data
      mountPath: /var/data
      sizeGB: 1
