services:
  - type: pserv
    name: muck-ltc-payout
    runtime: docker
    plan: 1c-2g
    region: oregon
    autoDeployTrigger: off
    dockerfilePath: ./infra/ltc-payout/Dockerfile
    dockerContext: ./infra/ltc-payout
    maxShutdownDelaySeconds: 120
    disk:
      name: muck-ltc-payout-data
      mountPath: /var/data
      sizeGB: 30
